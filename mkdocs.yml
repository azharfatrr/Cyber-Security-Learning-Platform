site_name: Cyber Security Learning Platform
site_description: Hands-on Android security lab guides
docs_dir: docs
site_dir: site
exclude_docs: |
  /superpowers/
theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/header-home.js
  - javascripts/text-size.js
nav:
  - Home: index.md
  - Lab structure: lab-structure.md
  - Setup:
      - Common prerequisites: 00-common-setup.md
      - Devom setup: 01-devom-setup.md
      - BugBazaar setup: 02-bugbazaar-setup.md
  - Labs:
      - 09 — JWT account state: 09-jwt-account-state.md
      - 10 — OTP bypass: 10-otp-bypass.md
      - 14 — Command injection: 14-command-injection.md
      - 24 — File upload: 24-file-upload.md
      - 25 — Path traversal: 25-path-traversal.md
      - 26 — Transaction validation: 26-transactions.md
      - 27 — Cloud database: 27-cloud-database.md
      - 28 — Object authorization: 28-bola.md
      - 29 — Android components: 29-components.md
      - 30 — Runtime bypass: 30-runtime-bypass.md
  - Coverage analysis: coverage-analysis.md
markdown_extensions:
  - md_in_html
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
