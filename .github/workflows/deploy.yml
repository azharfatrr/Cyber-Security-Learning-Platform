name: Deploy MkDocs site to GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build LabKit
        run: python3 labkit/build.py

      - name: Test site
        run: python -m unittest -v test_site

      - name: Build site
        run: python -m mkdocs build --strict

      - name: Check local links and assets
        run: python3 scripts/check_site_links.py site

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: engineering/qa/package-lock.json

      - name: Install accessibility audit dependencies
        run: npm ci --prefix engineering/qa

      - name: Install Chromium
        run: engineering/qa/node_modules/.bin/playwright install --with-deps chromium

      - name: Audit accessibility
        run: node engineering/qa/accessibility_audit.mjs site

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
